<dialog class="enquiry-drawer" id="enquiry" aria-labelledby="enquiry-heading" data-errors="{{ form_error|yesno:'true,false' }}">
  <div class="drawer-header"><span class="eyebrow">NCCT / Project enquiry</span><button type="button" class="close-button" data-close aria-label="Close enquiry">×</button></div>
  <div class="drawer-content"><p class="eyebrow">A conversation about light</p><h2 id="enquiry-heading">Tell us about<br>your space.</h2><p class="drawer-intro">Share a few details and our team can get in touch.<br>Fields marked * are required.</p>
  {% include 'partials/enquiry_form.html' %}
  <div class="drawer-contact">Prefer to speak directly? <a href="tel:{{ content.phone|cut:' ' }}">{{ content.phone }}</a></div>
  </div>
</dialog>
<noscript><style>#enquiry{display:block;position:relative;width:100%;max-width:none;height:auto;max-height:none;margin:0;border:0}.menu-toggle,[data-close]{display:none}.category-panel[hidden]{display:block;margin-bottom:2rem}</style></noscript>
