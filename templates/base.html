{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title|default:'NCCT — Architectural & Professional Lighting' }}</title>
  <meta name="description" content="{{ meta_description }}">
  <meta name="theme-color" content="#0B1E34">
  <link rel="canonical" href="{{ canonical }}">
  {% if noindex %}<meta name="robots" content="noindex, follow">{% endif %}
  <meta property="og:type" content="website"><meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ meta_description }}"><meta property="og:url" content="{{ canonical }}"><meta property="og:image" content="{{ social_image }}">
  <meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{{ page_title }}"><meta name="twitter:description" content="{{ meta_description }}"><meta name="twitter:image" content="{{ social_image }}">
  {% if content.google_verification %}<meta name="google-site-verification" content="{{ content.google_verification }}">{% endif %}
  {% if content.bing_verification %}<meta name="msvalidate.01" content="{{ content.bing_verification }}">{% endif %}
  <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  <link rel="stylesheet" href="{% static 'css/catalogue.css' %}">
  <script src="{% static 'js/site.js' %}" defer></script>
  {% block head %}{% endblock %}
</head>
<body class="{% if request.path != '/' %}inner-page{% endif %}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% block body %}{% endblock %}
</body>
</html>
