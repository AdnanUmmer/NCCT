<div class="document-list">{% for document in documents %}<article class="document-row"><div><p class="eyebrow">{{ document.get_document_type_display }}</p><h3>{{ document.title }}</h3>{% if document.description %}<p>{{ document.description }}</p>{% endif %}<span class="file-meta">PDF · {{ document.file_size|filesizeformat }} · {{ document.language }}</span></div><a class="button button-outline" href="{{ document.get_absolute_url }}">Download<span class="sr-only"> {{ document.title }}</span></a></article>{% endfor %}</div>
