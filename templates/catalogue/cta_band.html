{% if cta.cta_heading %}<section class="cta-band"><div><p class="eyebrow">{{ cta.cta_eyebrow }}</p><h2>{{ cta.cta_heading }}</h2></div>{% if cta.cta_link %}<a class="button" href="{{ cta.cta_link }}">{{ cta.cta_text|default:"Get in touch" }}</a>{% else %}<a class="button" href="#enquiry" data-enquire data-interest="{{ interest }}">{{ cta.cta_text|default:"Send an enquiry" }}</a>{% endif %}</section>{% endif %}
