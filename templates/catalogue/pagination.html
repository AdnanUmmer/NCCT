{% if listing.has_other_pages %}<nav class="pagination" aria-label="Pagination">{% if listing.has_previous %}<a href="?{{ query_string }}&amp;page={{ listing.previous_page_number }}" class="text-link">Previous</a>{% endif %}<span>Page {{ listing.number }} of {{ listing.paginator.num_pages }}</span>{% if listing.has_next %}<a href="?{{ query_string }}&amp;page={{ listing.next_page_number }}" class="text-link">Next</a>{% endif %}</nav>{% endif %}
