<div class="catalogue-grid">{% for product in items %}<article class="catalogue-card"><a href="{{ product.get_absolute_url }}"><div class="catalogue-image"><img src="{{ product.image_url }}" alt="{{ product.image_alt }}" width="600" height="600" loading="lazy"></div><p class="eyebrow">{{ product.category.name }}</p><h{{ heading_level|default:2 }}>{{ product.name }}</h{{ heading_level|default:2 }}>{% if product.model_reference %}<p class="model-reference">{{ product.model_reference }}</p>{% endif %}<span class="text-link">View product</span></a></article>{% endfor %}</div>
